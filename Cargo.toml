[package]
name = "adaq-talib"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust, zero-FFI, no-dependency reimplementation of TA-Lib 0.7.1 technical-analysis indicators."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/tonywxx/adaq-talib"
homepage = "https://github.com/tonywxx/adaq-talib"
documentation = "https://docs.rs/adaq-talib"
keywords = [
    "technical-analysis",
    "ta-lib",
    "indicators",
    "quantitative",
    "finance",
]
categories = ["finance", "algorithms", "science"]
authors = ["tonywxx"]

# Files excluded from the published crate (dev/agent artifacts, not library source).
exclude = [
    ".workbuddy",
    ".codegraph",
    "tools/gen_fixtures/__pycache__",
    "/tony",
]

[dependencies]

[features]
# 启用后，benches 通过 FFI 链接系统 TA-Lib C 库做原生对照（见 ADR 0004）。
# When enabled, benches FFI-link the system TA-Lib C library for native comparison (ADR 0004).
bench-c = []

[[bench]]
name = "sma_bench"
harness = false

[[bench]]
name = "dema_bench"
harness = false

[[bench]]
name = "tema_bench"
harness = false

[[bench]]
name = "t3_bench"
harness = false

[[bench]]
name = "wma_bench"
harness = false

[[bench]]
name = "midprice_bench"
harness = false

[[bench]]
name = "bbands_bench"
harness = false

[[bench]]
name = "linreg_bench"
harness = false

[[bench]]
name = "correl_bench"
harness = false

[[bench]]
name = "willr_bench"
harness = false

[[bench]]
name = "stoch_bench"
harness = false

[[bench]]
name = "minmax_bench"
harness = false

[[bench]]
name = "index_bench"
harness = false
