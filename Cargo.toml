[package]
name = "adaq-talib"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust, zero-FFI, no-dependency reimplementation of TA-Lib 0.7.1 technical-analysis indicators."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/tonywxx/adaq-talib"
homepage = "https://github.com/tonywxx/adaq-talib"
documentation = "https://docs.rs/adaq-talib"
keywords = [
    "technical-analysis",
    "ta-lib",
    "indicators",
    "quantitative",
    "finance",
]
categories = ["finance", "algorithms", "science"]
authors = ["tonywxx"]

# Files excluded from the published crate (dev/agent artifacts, not library source).
exclude = [
    ".workbuddy",
    ".codegraph",
    "tools/gen_fixtures/__pycache__",
    "/tony",
]

[dependencies]

[features]
# 启用后，benches 通过 FFI 链接系统 TA-Lib C 库做原生对照（见 ADR 0004）。
# When enabled, benches FFI-link the system TA-Lib C library for native comparison (ADR 0004).
bench-c = []

# 默认关闭。启用后，可重叠播种的窗口类指标（如 midpoint/minmax 的滚动极值双端队列）
# 通过 std::thread 多核分块并行，复用与串行完全一致的内核以保证输出逐项 1:1。
# No-Deps 安全：仅依赖 std（thread::scope / available_parallelism），不引入任何外部 crate。
# Default-off. When enabled, window-based indicators that admit overlap seeding (e.g. the
# rolling-min/max deques in `midpoint`/`minmax`) run multi-core via `std::thread`, reusing the
# EXACT serial kernel so output stays 1:1. No-Deps-safe: std-only, no external crates.
parallel = []

[[bench]]
name = "sma_bench"
harness = false

[[bench]]
name = "dema_bench"
harness = false

[[bench]]
name = "tema_bench"
harness = false

[[bench]]
name = "t3_bench"
harness = false

